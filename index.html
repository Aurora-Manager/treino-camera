<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Treino na Câmera</title>
<style>
  :root {
    --ink: #0b1220; --card: #141d30; --card2: #1b2740; --panel: rgba(11,18,32,.74); --line: rgba(255,255,255,.12);
    --text: #f3f6fb; --muted: #a3afc4;
    --go: #3df2c0; --go-ink: #04241b; --warn: #ffb648; --bad: #ff6b6b;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; cursor: pointer; background: none; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--go); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 30px; line-height: 1.12; letter-spacing: -.02em; text-wrap: balance; }
  h1 span, .accent { color: var(--go); }
  h2 { font-size: 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* Telas do aplicativo */
  #app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 18px;
    padding: calc(22px + var(--sat)) 18px calc(96px + var(--sab)); }
  #app.nonav { padding-bottom: calc(26px + var(--sab)); }
  .primary { background: var(--go); color: var(--go-ink); font-weight: 800; font-size: 18px; padding: 16px;
    border-radius: 16px; width: 100%; }
  .primary:disabled { opacity: .45; }
  .ghost { border: 1px solid var(--line); border-radius: 14px; padding: 13px; font-weight: 600; width: 100%; }
  .row { display: flex; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
  .spacer { flex: 1; }

  /* Perguntas iniciais */
  .steps { display: flex; gap: 5px; }
  .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--card2); }
  .steps i.on { background: var(--go); }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 15px 16px;
    display: grid; gap: 2px; }
  .opt b { font-size: 17px; }
  .opt.on { border-color: var(--go); background: #12302c; }
  .opts.grid4 { grid-template-columns: repeat(4, 1fr); }
  .opts.grid4 .opt { text-align: center; padding: 16px 4px; }
  .opts.grid4 .opt b { font-size: 24px; }
  .field { display: grid; gap: 6px; }
  .field input { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; font-size: 18px; width: 100%; }
  .fields3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  /* Listas de treino */
  .ex { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 0; border-top: 1px solid var(--line); }
  .ex:first-of-type { border-top: 0; }
  .ex .dose { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .ex .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 6px; background: #12302c; color: var(--go); vertical-align: 1px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fact { background: var(--card2); border-radius: 12px; padding: 10px 12px; }
  .fact span { display: block; font-size: 12px; color: var(--muted); }
  .fact b { font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
  .stats b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .big { font-size: 76px; font-weight: 800; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
  .center { text-align: center; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; background: rgba(11,18,32,.94);
    border-top: 1px solid var(--line); padding: 8px 12px calc(8px + var(--sab)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  nav button { flex: 1; max-width: 180px; padding: 12px 6px; border-radius: 12px; font-weight: 600; color: var(--muted); }
  nav button.on { color: var(--go); background: var(--card); }

  #toast { position: fixed; left: 18px; right: 18px; bottom: calc(100px + var(--sab)); margin: 0 auto; max-width: 520px;
    background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 13px 16px; text-align: center; z-index: 30; }

  /* Tela da câmera */
  #stage { position: fixed; inset: 0; background: #000; z-index: 10; }
  #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #stage.mirror video, #stage.mirror canvas { transform: scaleX(-1); }
  #counter { position: absolute; top: calc(14px + var(--sat)); left: 14px; width: 128px; height: 128px; }
  #counter svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #counter circle { fill: none; stroke-width: 9; }
  #counter .bg { fill: var(--panel); stroke: var(--line); }
  #counter .fg { stroke: var(--go); stroke-linecap: round; transition: stroke-dashoffset .3s; }
  #counter .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  #reps { font-size: 50px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #goal { font-size: 13px; color: var(--muted); }
  #head { position: absolute; top: calc(14px + var(--sat)); left: 154px; right: 14px; background: var(--panel);
    border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; }
  #head b { font-size: 17px; line-height: 1.2; }
  #head span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #depth { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 40%;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #depthFill { position: absolute; left: 0; right: 0; top: 0; height: 0; background: var(--warn); }
  #depthFill.ok { background: var(--go); }
  #cue { position: absolute; left: 14px; right: 14px; bottom: calc(92px + var(--sab)); text-align: center;
    font-size: 25px; font-weight: 800; line-height: 1.15; padding: 14px 16px; border-radius: 16px;
    background: var(--panel); border: 2px solid var(--warn); color: var(--warn); text-wrap: balance; }
  #cue.good { border-color: var(--go); color: var(--go); }
  #cue.bad { border-color: var(--bad); color: var(--bad); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center;
    padding: 12px 12px calc(12px + var(--sab)); background: linear-gradient(transparent, rgba(0,0,0,.78)); }
  #bar button { flex: 1; max-width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 4px; font-weight: 600; font-size: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* Descanso */
  #rest { position: fixed; inset: 0; z-index: 20; background: rgba(8,13,24,.93); display: grid; place-content: center;
    gap: 16px; padding: 24px; text-align: center; }
  #rest .primary { min-width: 240px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main id="app"></main>
<nav id="nav" hidden>
  <button data-tab="treino">Treino</button>
  <button data-tab="ficha">Ficha</button>
  <button data-tab="historico">Histórico</button>
</nav>
<div id="toast" role="status" hidden></div>

<section id="stage" hidden>
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="counter" aria-live="polite">
    <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ring" cx="60" cy="60" r="52"/></svg>
    <div class="num"><div id="reps">0</div><div id="goal">de 12</div></div>
  </div>
  <div id="head"><b id="exName"></b><span id="setLabel"></span><span id="info"></span></div>
  <div id="depth"><div id="depthFill"></div></div>
  <div id="cue" hidden></div>
  <div id="bar">
    <button id="swap">Trocar câmera</button>
    <button id="voice">Voz: ligada</button>
    <button id="skipSet">Concluir série</button>
    <button id="quit">Sair</button>
  </div>
</section>

<section id="rest" hidden>
  <p class="muted">Descanso</p>
  <div class="big" id="restTime">0</div>
  <p id="restNext"></p>
  <button class="primary" id="restSkip">Pular descanso</button>
</section>

<script type="module" src="./app.js"></script>
</body>
</html>
